name: Build and release

# What this does
#   * every push of a tag like v0.3.0  -> checks, builds both Windows downloads on GitHub's own servers, publishes a release
#   * "Run workflow" button (Actions tab) -> same builds but NO release; download the results from the run page (a dry run)
#   * pull requests                    -> only the headless checks
# Nothing here uses secrets; the only token is the automatic, per-run GITHUB_TOKEN, and only the last job may write.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries Qt needs even when it runs headless
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg
      - name: Install the GUI's dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-gui.txt pyflakes
      - name: Lint
        run: python -m pyflakes ck2_gui tests launcher run_gui.py build_exe.py
      - name: Self-test and unit tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python run_gui.py --selftest
          python tests/test_modules.py

  launcher:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build CorridorKey2.exe from launcher/launcher.c (cross-compiled with zig)
        run: |
          python -m pip install ziglang==0.17.0 pillow
          python launcher/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-exe
          path: CorridorKey2.exe
          if-no-files-found: error

  standalone:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the standalone window exe, then start it once headless as a health check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build_exe.py --selftest --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-win64
          path: dist/CorridorKey2
          if-no-files-found: error

  release:
    # Runs only for tags. A failed standalone build does not stop the (more important) launcher release.
    needs: [check, launcher, standalone]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.check.result == 'success' && needs.launcher.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Make sure the tag matches the program's version
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ck2_gui/__init__.py)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match __version__ $ver in ck2_gui/__init__.py"; exit 1; }
      - name: Assemble the zips and checksums
        run: |
          set -euo pipefail
          VER="$GITHUB_REF_NAME"
          mkdir -p out stage/launcher stage/standalone
          add_docs() {   # README, licence, notices and guide travel with every download (relative links keep working)
            mkdir -p "$1/CorridorKey_docs"
            cp -r GUI_README.md LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES_GUI.md docs "$1/CorridorKey_docs/"
          }
          L=stage/launcher
          cp artifacts/launcher-exe/CorridorKey2.exe run_gui.py CorridorKey_GUI.bat CorridorKey_GUI.sh requirements-gui.txt "$L/"
          cp -r ck2_gui "$L/"
          add_docs "$L"
          find stage -name __pycache__ -type d -prune -exec rm -rf {} +
          (cd "$L" && zip -r -X -q "$GITHUB_WORKSPACE/out/CorridorKey2-${VER}-launcher.zip" .)
          if [ -d artifacts/standalone-win64 ]; then
            SD=stage/standalone/CorridorKey2-standalone
            mkdir -p "$SD"
            cp -r artifacts/standalone-win64/. "$SD/"
            add_docs "$SD"
            (cd stage/standalone && zip -r -X -q "$GITHUB_WORKSPACE/out/CorridorKey2-${VER}-standalone-win64.zip" CorridorKey2-standalone)
          else
            printf '\n> **Note:** the standalone build failed for this release, so only the launcher zip is attached.\n' >> .github/release-notes.md
          fi
          (cd out && sha256sum *.zip | tee SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CorridorKey 2.0 $GITHUB_REF_NAME" --notes-file .github/release-notes.md $pre
